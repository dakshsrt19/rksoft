 <div class="container-scroller">
      <div class="container-fluid page-body-wrapper full-page-wrapper">
        <div class="content-wrapper d-flex align-items-center auth">
          <div class="row flex-grow">
            <div class="col-lg-4 mx-auto">
              <div class="auth-form-light text-left p-5">
                <div class="brand-logo">
                  <a class="navbar-brand" href="['/dashboard']">
               <img src="assets/images/dsrlogo.png" alt="RKSoft">
              </a>
                </div>
                <h4>Hello! let's get started</h4>
                <h6 class="font-weight-light">Sign in to continue.</h6>
            <!-- Login Form Start -->
            <form class="pt-3" #loginForm="ngForm" (ngSubmit)="onLogin()" novalidate>
              <div class="form-group">

                  <input
                    type="text"
                    id="username"
                    name="username"
                    [(ngModel)]="username"
                    required
                    class="form-control form-control-lg"
                    placeholder="Enter username"
                    #emailRef="ngModel"
                  />
                  <div class="text-danger" *ngIf="emailRef.invalid && emailRef.touched">
                    <div *ngIf="emailRef.errors?.['required']">Email is required.</div>
                    <!-- Uncomment below to enable email format validation -->
                    <!-- <div *ngIf="emailRef.errors?.['email']">Enter a valid email.</div> -->
                  </div>
                </div>

              <div class="form-group">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    [(ngModel)]="password"
                    required
                    minlength="6"
                    class="form-control form-control-lg"
                    placeholder="Password"
                    #passwordRef="ngModel"
                    autocomplete="current-password"
                  />
                  <div class="text-danger" *ngIf="passwordRef.invalid && passwordRef.touched">
                    <div *ngIf="passwordRef.errors?.['required']">Password is required.</div>
                    <div *ngIf="passwordRef.errors?.['minlength']">Password must be at least 6 characters.</div>
                  </div>
                </div>

              <div *ngIf="errorMessage" class="text-danger mb-3">{{ errorMessage }}</div>

              <div class="button-box">
                <div class="login-toggle-btn">

                </div>
                <button
                  type="submit"
                 class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn"
                  [disabled]="loginForm.invalid"
                >
                  Sign in
                </button>
              </div>
            </form>
            <!-- Login Form End -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
